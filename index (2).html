<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My VR Escape Room</title>

  <!--
    A-Frame is a JavaScript library that lets us build 3D/VR scenes
    using HTML-style tags.
  -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>
    body { margin: 0; }
  </style>
</head>

<body>

  <!-- ============================================================
       A-FRAME SCENE
       Everything in the VR world goes inside <a-scene>.
       ============================================================ -->
  <a-scene>

    <!-- LIGHTING -->
    <a-light type="ambient" color="#BBB"></a-light>
    <a-light type="directional" intensity="0.7" position="-1 3 1"></a-light>

    <!-- FLOOR -->
    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="10"
      height="10"
      color="#CCCCCC">
    </a-plane>

    <!-- BACK WALL -->
    <a-box
      position="0 1.5 -8"
      width="10"
      height="3"
      depth="0.2"
      color="#EEEEEE">
    </a-box>

    <!-- SIDE WALLS -->
    <a-box
      position="-5 1.5 -4"
      width="0.2"
      height="3"
      depth="8"
      color="#EEEEEE">
    </a-box>

    <a-box
      position="5 1.5 -4"
      width="0.2"
      height="3"
      depth="8"
      color="#EEEEEE">
    </a-box>

    <!-- INTERACTIVE BUTTON -->
    <a-box
      id="powerSwitch"
      position="-1 1.2 -4"
      width="0.5"
      height="0.5"
      depth="0.2"
      color="red">
    </a-box>

    <!-- DOOR -->
    <a-box
      id="finalDoor"
      position="1.5 1.5 -7.8"
      width="1.6"
      height="3"
      depth="0.2"
      color="#795548">
    </a-box>

    <!-- MESSAGE -->
    <a-text
      id="messageText"
      value="Find the switch."
      position="0 2.4 -4"
      align="center"
      width="5"
      color="#202833">
    </a-text>

    <!-- CAMERA + CURSOR -->
    <a-camera position="0 1.6 0">
      <a-cursor></a-cursor>
    </a-camera>

    <!-- SKY -->
    <a-sky color="#F5F5F5"></a-sky>

  </a-scene>


  <!-- ============================================================
       JAVASCRIPT
       JavaScript makes the A-Frame objects interactive.
       ============================================================ -->
  <script>

    // A Boolean variable remembers whether the power is on.
    let powerOn = false;

    // Find the HTML/A-Frame elements by their IDs.
    const powerSwitch = document.getElementById('powerSwitch');
    const finalDoor = document.getElementById('finalDoor');
    const messageText = document.getElementById('messageText');

    // This function changes the message shown to the player.
    function showMessage(message) {
      messageText.setAttribute('value', message);
    }

    // This function opens the final door.
    function openDoor() {
      finalDoor.setAttribute('animation', {
        property: 'position',
        to: '3 1.5 -7.8',
        dur: 700
      });
    }

    // Wait for the player to click the switch.
    powerSwitch.addEventListener('click', function () {

      // Update the game state.
      powerOn = true;

      // Give visual feedback.
      powerSwitch.setAttribute('color', 'green');

      // Give text feedback.
      showMessage('Power restored. Door unlocked!');

      // Call the function that opens the door.
      openDoor();
    });

  </script>

</body>
</html>
